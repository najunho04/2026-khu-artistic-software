# 예소 백엔드 CI
#
# 하는 일은 하나입니다. "main 에 들어가는 코드는 테스트를 통과한 코드여야 한다" 를 강제합니다.
# ROADMAP.md 1-1 의 잔여 작업이며, 테스트 환경 확정 항목 T-4 에 해당합니다.
#
# 지켜야 할 조건 두 가지 (ROADMAP.md 0-A T-3 / T-4)
#   1. 이 워크플로는 "외부 네트워크에 의존하지 않는다".
#      구글, 카카오 같은 외부 호출은 전부 Mock 으로 대체한다.
#      남의 서버가 느리거나 죽었다는 이유로 우리 빌드가 빨간불이 되면 안 되고,
#      테스트용 소셜 계정과 비밀키를 CI 에 넣어야 하는 문제도 생기기 때문이다.
#      실제 구현 객체로 하는 통합 실검증은 로컬에서 사람이 수동으로 돌린다.
#   2. Testcontainers 가 러너에서 실제로 동작해야 한다.
#      ubuntu-latest 러너에는 Docker 가 미리 설치되어 있어 그대로 동작한다.
#      만약 동작하지 않으면 DockerAvailabilityTest 가 실패해서 알려준다.
#      이 안전장치가 없으면 통합 테스트가 전부 건너뛰어졌는데도 빌드는 초록불인
#      "검증되지 않은 그린" 상태가 되어 CI 가 아무것도 지켜주지 못한다.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 같은 브랜치에 새 커밋이 올라오면 진행 중이던 이전 실행을 취소한다.
# 어차피 버려질 결과를 기다리며 러너를 점유하지 않기 위함이다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 이 워크플로는 저장소를 읽기만 한다. 필요 이상의 권한을 주지 않는다.
permissions:
  contents: read

jobs:
  test:
    name: 테스트 (JUnit 5 + Testcontainers)
    runs-on: ubuntu-latest

    # Testcontainers 가 postgres 와 redis 이미지를 내려받는 시간까지 감안한 값이다.
    # 이 시간을 넘기면 무언가 매달려 있는 것이므로 러너를 붙잡아두지 않고 끊는다.
    timeout-minutes: 20

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      # ROADMAP.md 기술 스택에서 확정한 Java 21 을 사용한다.
      # build.gradle 의 toolchain 설정과 이 값이 어긋나면 Gradle 이 JDK 를 따로
      # 내려받으려 하므로, 두 곳을 항상 같이 맞춰야 한다.
      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # gradle-wrapper.jar 이 공식 배포본과 같은 파일인지 검증한다.
      # 래퍼 jar 은 빌드 때 그대로 실행되는 바이너리라서, 이것이 바뀌면
      # 저장소에 커밋된 코드를 아무리 봐도 알 수 없는 동작이 끼어들 수 있다.
      - name: Gradle 래퍼 검증
        uses: gradle/actions/wrapper-validation@v4

      # Gradle 의존성과 빌드 캐시를 실행 사이에 재사용해 빌드 시간을 줄인다.
      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      # ROADMAP.md 1-1 이 요구하는 단계다.
      # 로컬 전용 통합 실검증 테스트가 만들어지면 (인증 API 1-4 시점에 분리 방식 확정)
      # 이 명령에서 그 테스트를 제외하는 옵션을 여기에 추가해야 한다.
      - name: 테스트 실행
        run: ./gradlew test

      # 실패했을 때 로그만 보고 원인을 찾기 어려우므로 리포트를 통째로 남긴다.
      # 성공한 경우에도 남기는 이유는 건너뛴 테스트가 있었는지 확인하기 위해서다.
      - name: 테스트 리포트 보관
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            build/reports/tests/test
            build/test-results/test
          retention-days: 14
