spring.application.name=artistic-software-khu

# 하이버네이트가 테이블을 만들거나 바꾸지 못하게 막고, 대조만 하게 한다.
#
# 테이블의 주인은 Flyway 다. db/migration 의 SQL 이 스키마를 정의하며,
# 거기에는 "where deleted_at is null" 같은 부분 유니크 인덱스처럼 하이버네이트가
# 알지 못하는 것들이 들어 있다. ddl-auto 를 create 나 update 로 두면 테이블 주인이
# 둘이 되어, 하이버네이트가 자기 판단으로 스키마를 고치면서 그 조건들이 사라진다.
#
# none 대신 validate 를 쓰는 이유는 어긋난 것을 "언제" 알게 되느냐가 다르기 때문이다.
# none 은 앱이 그냥 뜨고, 그 엔티티를 실제로 쓰는 요청이 들어올 때 처음 터진다.
# validate 는 기동하는 순간 엔티티와 실제 테이블을 대조해서 어긋나면 앱을 띄우지 않는다.
# 컬럼 이름 오타나 타입 불일치는 컴파일로 걸러지지 않으므로 이 검사가 유일한 방어선이다.
spring.jpa.hibernate.ddl-auto=validate

# 브라우저에서 서버를 직접 부를 수 있는 출처 목록 (CORS). "API.md" 1-1-2, 2026-10-31 확정.
#
# 지금은 GitHub Pages 에서 도는 가상 기기 페이지 하나뿐이다. 출처는 "주소의 경로를 뺀
# 앞부분" 이라 페이지 경로(/aritistic_software_device/)는 적지 않는다.
# 여러 개면 쉼표로 잇는다. 앱과 실제 기기는 브라우저가 아니라서 여기에 넣을 필요가 없다.
yeso.cors.allowed-origins=https://philipn337-namphil.github.io
